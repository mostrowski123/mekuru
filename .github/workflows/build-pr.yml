name: Build PR Checks

on:
  pull_request:
    paths:
      - 'lib/**'
      - 'packages/**'
      - 'android/**'
      - 'assets/**'
      - 'test/**'
      - 'scripts/verify_native_libs.py'
      - 'scripts/test_verify_native_libs.py'
      - 'scripts/check_release_ready.py'
      - 'scripts/test_check_release_ready.py'
      - 'tools/build_aozora_catalog.py'
      - 'tools/build_tadoku_catalog.py'
      - 'tools/test_build_tadoku_catalog.py'
      - 'tools/requirements-free-books.txt'
      - 'pubspec.yaml'
      - 'pubspec.lock'
      - '.github/workflows/build-pr.yml'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 75

    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Java 17
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          # Bump on purpose, with the local SDK: a new stable can break the build.
          flutter-version: 3.47.9
          cache: true

      - name: Cache pub dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.pub-cache
            .dart_tool
          key: pub-${{ hashFiles('pubspec.lock') }}
          restore-keys: pub-

      - name: Cache Gradle
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('android/gradle/wrapper/gradle-wrapper.properties', 'android/build.gradle.kts', 'android/app/build.gradle.kts') }}
          restore-keys: gradle-

      - name: Configure Gradle for GitHub runner
        run: |
          mkdir -p ~/.gradle
          cat > ~/.gradle/gradle.properties <<'EOF'
          # Match the release workflow's CI-only Gradle memory limits.
          org.gradle.daemon=false
          org.gradle.jvmargs=-Xmx3G -XX:MaxMetaspaceSize=1G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
          org.gradle.workers.max=2
          org.gradle.vfs.watch=false
          EOF

      - name: Install dependencies
        run: flutter pub get

      - name: Run code generation
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Generate environment config
        run: >
          flutter pub run environment_config:generate
          --sentryDsn=${{ secrets.SENTRY_DSN }}
          --sentryEnvironment=development

      - name: Run static analysis
        run: flutter analyze

      - name: Run tests
        timeout-minutes: 20
        run: flutter test -r expanded --file-reporter=json:build/flutter-tests.json

      # Covers the SAF document-ID resolution in MainActivity.kt, which
      # flutter test cannot reach. Neither local.properties nor the Gradle
      # wrapper is in the repo; `--config-only` has Flutter write both without
      # building anything.
      - name: Run Android unit tests
        timeout-minutes: 20
        run: |
          flutter build apk --config-only --debug --flavor parallel --no-pub
          cd android
          ./gradlew :app:testPlayDebugUnitTest :local_manga_ocr:testDebugUnitTest --console=plain


      - name: Test native archive validation
        run: python -m unittest discover -s scripts -p test_verify_native_libs.py

      - name: Test release readiness checks
        run: python -m unittest discover -s scripts -p test_check_release_ready.py

      # The catalog builder needs PyMuPDF; this Python lets pip install it.
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'

      - name: Test the Graded readers catalog builder
        run: |
          python -m pip install -r tools/requirements-free-books.txt
          python -m unittest discover -s tools -p test_build_tadoku_catalog.py

      - name: Verify emulator-to-phone native packaging without cleaning
        run: |
          flutter build apk --debug --flavor parallel --target-platform android-x64 --split-per-abi --no-pub
          python scripts/verify_native_libs.py build/app/outputs/flutter-apk/app-x86_64-parallel-debug.apk --abis x86_64
          flutter build apk --debug --flavor parallel --target-platform android-arm64 --split-per-abi --no-pub
          python scripts/verify_native_libs.py build/app/outputs/flutter-apk/app-arm64-v8a-parallel-debug.apk --abis arm64-v8a

      # Fails the PR, since the release workflows stop on a missing key, but
      # runs last so an English-first PR still gets its test results.
      - name: Check translations
        if: ${{ !cancelled() }}
        run: python scripts/check_release_ready.py --translations

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: unit-test-reports
          if-no-files-found: ignore
          path: |
            build/flutter-tests.json
            build/app/test-results/**/*.xml
            build/local_manga_ocr/test-results/**/*.xml
