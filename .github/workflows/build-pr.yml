name: Build PR Checks

on:
  pull_request:
    paths:
      - 'lib/**'
      - 'packages/local_manga_ocr/**'
      - 'android/**'
      - 'assets/**'
      - 'test/**'
      - 'scripts/verify_native_libs.py'
      - 'scripts/test_verify_native_libs.py'
      - 'pubspec.yaml'
      - 'pubspec.lock'
      - '.github/workflows/build-pr.yml'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 75

    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Cache pub dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.pub-cache
            .dart_tool
          key: pub-${{ hashFiles('pubspec.lock') }}
          restore-keys: pub-

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('android/gradle/wrapper/gradle-wrapper.properties', 'android/build.gradle.kts', 'android/app/build.gradle.kts') }}
          restore-keys: gradle-

      - name: Configure Gradle for GitHub runner
        run: |
          mkdir -p ~/.gradle
          cat > ~/.gradle/gradle.properties <<'EOF'
          # Match the release workflow's CI-only Gradle memory limits.
          org.gradle.daemon=false
          org.gradle.jvmargs=-Xmx3G -XX:MaxMetaspaceSize=1G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
          org.gradle.workers.max=2
          org.gradle.vfs.watch=false
          EOF

      - name: Install dependencies
        run: flutter pub get

      - name: Run code generation
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Generate environment config
        run: >
          flutter pub run environment_config:generate
          --sentryDsn=${{ secrets.SENTRY_DSN }}
          --sentryEnvironment=development

      - name: Run static analysis
        run: flutter analyze

      - name: Run tests
        timeout-minutes: 20
        run: flutter test -r expanded --file-reporter=json:build/flutter-tests.json

      # Covers the SAF document-ID resolution in MainActivity.kt, which
      # flutter test cannot reach. Neither local.properties nor the Gradle
      # wrapper is in the repo; `--config-only` has Flutter write both without
      # building anything.
      - name: Run Android unit tests
        timeout-minutes: 20
        run: |
          flutter build apk --config-only --debug --flavor parallel --no-pub
          cd android
          ./gradlew :app:testPlayDebugUnitTest :local_manga_ocr:testDebugUnitTest --console=plain


      - name: Test native archive validation
        run: python -m unittest discover -s scripts -p test_verify_native_libs.py

      - name: Verify emulator-to-phone native packaging without cleaning
        run: |
          flutter build apk --debug --flavor parallel --target-platform android-x64 --split-per-abi --no-pub
          python scripts/verify_native_libs.py build/app/outputs/flutter-apk/app-x86_64-parallel-debug.apk --abis x86_64
          flutter build apk --debug --flavor parallel --target-platform android-arm64 --split-per-abi --no-pub
          python scripts/verify_native_libs.py build/app/outputs/flutter-apk/app-arm64-v8a-parallel-debug.apk --abis arm64-v8a

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-reports
          if-no-files-found: ignore
          path: |
            build/flutter-tests.json
            build/app/test-results/**/*.xml
            build/local_manga_ocr/test-results/**/*.xml
