name: iOS Integration Tests

on:
  pull_request:
    paths:
      - 'lib/**'
      - 'packages/**'
      - 'ios/**'
      - 'assets/**'
      - 'integration_test/**'
      - 'scripts/run_ios_integration_tests.sh'
      - 'pubspec.yaml'
      - 'pubspec.lock'
      - '.github/workflows/integration-ios.yml'
  push:
    branches: [main]
    paths:
      - 'lib/**'
      - 'packages/**'
      - 'ios/**'
      - 'assets/**'
      - 'integration_test/**'
      - 'scripts/run_ios_integration_tests.sh'
      - 'pubspec.yaml'
      - 'pubspec.lock'
      - '.github/workflows/integration-ios.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  ios-integration:
    runs-on: macos-latest
    timeout-minutes: 120
    # Each shard pays for one cold app build (about ten minutes on a runner)
    # for its shared files, plus three to five minutes per file that builds
    # on its own; the tests themselves take a minute or two per file. Four shards: macOS runners are free for
    # this public repo, but GitHub Free runs at most five macOS jobs at once,
    # and a PR also starts build-ios-pr.yml.
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]

    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      IOS_IT_SHARD: ${{ matrix.shard }}/4

    steps:
      - uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Cache pub dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.pub-cache
            .dart_tool
          key: pub-macos-${{ hashFiles('pubspec.lock') }}
          restore-keys: pub-macos-

      - name: Cache Swift packages
        uses: actions/cache@v4
        with:
          path: build/ios/SourcePackages
          key: spm-${{ hashFiles('ios/Runner.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}
          restore-keys: spm-

      - name: Install dependencies
        run: flutter pub get

      - name: Run code generation
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Generate environment config
        run: >
          flutter pub run environment_config:generate
          --sentryDsn=
          --sentryEnvironment=ci

      - name: Boot a simulator
        id: simulator
        run: |
          udid=$(xcrun simctl list devices available --json |
            python3 -c "import json,sys; d=json.load(sys.stdin)['devices']; print(next(x['udid'] for r in sorted(d, reverse=True) if 'iOS' in r for x in d[r] if x['name'].startswith('iPhone')))")
          xcrun simctl boot "$udid"
          xcrun simctl bootstatus "$udid" -b
          echo "udid=$udid" >> "$GITHUB_OUTPUT"

      # Each line is a test file that has passed on an iPhone simulator. The
      # files before "--" run together from one generated entry point, so
      # they share one app build; the files after it build the app each:
      # they boot the real app, open the EPUB reader (whose WebView broke
      # when a second reader test ran in the same process), or haven't been
      # checked beside the others. A watchdog stops a run that goes quiet:
      # a failing iOS integration test can hang instead of failing (see the
      # script). Not listed: Android-only suites (full_backup_*, local_ocr_*,
      # pro_entitlement_flow) and word_tap_lookup_* (no tap reaches the
      # WKWebView under the integration-test binding). vision_ocr_test
      # downloads the manga-ocr pack (about 200 MB).
      - name: Run iOS integration tests
        run: >
          scripts/run_ios_integration_tests.sh ${{ steps.simulator.outputs.udid }}
          integration_test/dictionary_search_flow_test.dart
          integration_test/vocabulary_lifecycle_test.dart
          integration_test/settings_persistence_test.dart
          integration_test/cross_feature_navigation_test.dart
          integration_test/backup_restore_roundtrip_test.dart
          integration_test/bookmark_highlight_persistence_test.dart
          integration_test/pending_restore_flow_test.dart
          integration_test/reader_progress_persistence_flow_test.dart
          integration_test/dictionary_import_flow_test.dart
          integration_test/vocabulary_csv_export_test.dart
          integration_test/library_import_flow_test.dart
          integration_test/collections_flow_test.dart
          integration_test/mecab_enhanced_dict_upgrade_test.dart
          integration_test/epub_furigana_export_flow_test.dart
          integration_test/furigana_generator_flow_test.dart
          integration_test/manga_word_segmentation_test.dart
          integration_test/server_sync_flow_test.dart
          integration_test/epub_manga_convert_flow_test.dart
          --
          integration_test/app_smoke_test.dart
          integration_test/orphan_sweep_flow_test.dart
          integration_test/reader_indesign_vertical_epub_test.dart
          integration_test/reader_scroll_view_vertical_test.dart
          integration_test/reader_scroll_view_horizontal_test.dart
          integration_test/reader_scroll_view_resume_test.dart
          integration_test/ios_full_backup_test.dart
          integration_test/reader_resume_reopen_test.dart
          integration_test/vision_ocr_test.dart
          integration_test/free_books_flow_test.dart
          integration_test/pdf_import_flow_test.dart
          integration_test/comic_archive_import_test.dart
          integration_test/reader_bridge_regression_test.dart
          integration_test/reader_ready_signal_lost_test.dart
          integration_test/library_bookmark_open_test.dart
          integration_test/reader_relayout_page_alignment_test.dart
          integration_test/reader_custom_font_test.dart
          integration_test/reader_custom_font_missing_test.dart
          integration_test/reader_image_pages_test.dart
          integration_test/reader_image_pages_scroll_test.dart
          integration_test/reader_fixed_layout_test.dart
