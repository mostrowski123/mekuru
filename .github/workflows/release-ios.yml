name: Release iOS to TestFlight

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  testflight:
    runs-on: macos-latest
    timeout-minutes: 90

    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      # Job-level so the symbol-upload step's `if:` can test it (steps cannot
      # read the secrets context directly).
      SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
      ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Cache pub dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.pub-cache
            .dart_tool
          key: pub-macos-${{ hashFiles('pubspec.lock') }}
          restore-keys: pub-macos-

      - name: Cache Swift packages
        uses: actions/cache@v4
        with:
          path: build/ios/SourcePackages
          key: spm-${{ hashFiles('ios/Runner.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}
          restore-keys: spm-

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Install dependencies
        run: flutter pub get

      - name: Run code generation
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Generate environment config
        run: >
          flutter pub run environment_config:generate
          --sentryDsn=${{ secrets.SENTRY_DSN }}
          --sentryEnvironment=production

      # TestFlight needs a build number that rises within a version.
      # ponytail: run_number restarts at 1 if this workflow file is renamed;
      # add a floor (like PLAY_VERSION_CODE_FLOOR) if that ever happens.
      - name: Build archive
        run: flutter build ipa --no-codesign --no-pub --build-number=${{ github.run_number }}

      - name: Verify native frameworks
        run: |
          app=build/ios/archive/Runner.xcarchive/Products/Applications/Runner.app
          ls "$app/Frameworks"
          test -d "$app/Frameworks/mecab_dart.framework"
          test -d "$app/Frameworks/sqlite3.framework"

      # The export step re-signs only what already carries a full signature,
      # and reads the app's entitlements from its signature. In an unsigned
      # archive the app has neither, and the prebuilt Swift package frameworks
      # (Sentry, Firebase) have only the linker's stub signature, which App
      # Store validation then rejects (error 90035). Ad-hoc sign every
      # framework, then the app with Runner.entitlements.
      - name: Prepare the archive for signing
        run: |
          app=build/ios/archive/Runner.xcarchive/Products/Applications/Runner.app
          for framework in "$app"/Frameworks/*.framework; do
            codesign --force --sign - "$framework"
          done
          codesign --force --sign - --entitlements ios/Runner/Runner.entitlements "$app"

      # altool and xcodebuild both find the key in this directory by its ID.
      - name: Install App Store Connect API key
        env:
          ASC_API_KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY }}
        run: |
          mkdir -p ~/.appstoreconnect/private_keys
          printf '%s' "$ASC_API_KEY" > ~/.appstoreconnect/private_keys/AuthKey_$ASC_KEY_ID.p8

      # Signs with a cloud-managed distribution certificate, so the runner
      # needs no certificate or provisioning profile of its own.
      - name: Sign and export IPA
        run: >
          xcodebuild -exportArchive
          -archivePath build/ios/archive/Runner.xcarchive
          -exportOptionsPlist ios/ci/ExportOptions.plist
          -exportPath build/ios/ipa
          -allowProvisioningUpdates
          -authenticationKeyPath ~/.appstoreconnect/private_keys/AuthKey_$ASC_KEY_ID.p8
          -authenticationKeyID $ASC_KEY_ID
          -authenticationKeyIssuerID $ASC_ISSUER_ID

      # Catch a bad export here rather than in App Store validation: the App
      # Attest entitlement must have survived, and every framework must be
      # signed by the team, not left with an ad-hoc signature.
      - name: Verify signing
        run: |
          ls -l build/ios/ipa
          unzip -q build/ios/ipa/*.ipa -d build/ios/ipa/unpacked
          app=build/ios/ipa/unpacked/Payload/Runner.app
          codesign -d --entitlements - --xml "$app" > build/ios/ipa/entitlements.plist
          plutil -p build/ios/ipa/entitlements.plist
          grep -q 'com.apple.developer.devicecheck.appattest-environment' build/ios/ipa/entitlements.plist
          for framework in "$app"/Frameworks/*.framework; do
            team=$(codesign -dvv "$framework" 2>&1 | sed -n 's/^TeamIdentifier=//p')
            echo "$(basename "$framework"): $team"
            test "$team" = VE9NCMS5L4
          done

      - name: Upload to TestFlight
        run: xcrun altool --upload-app --type ios -f build/ios/ipa/*.ipa --apiKey $ASC_KEY_ID --apiIssuer $ASC_ISSUER_ID

      # The release the app itself reports (package@version+build); without it
      # the plugin files the symbols under `mekuru@<pubspec version>`.
      - name: Upload debug symbols to Sentry
        if: env.SENTRY_AUTH_TOKEN != ''
        run: |
          version=$(sed -n 's/^version: \([^+]*\).*/\1/p' pubspec.yaml)
          SENTRY_RELEASE="moe.matthew.mekuru@${version}+${{ github.run_number }}" dart run sentry_dart_plugin

      - name: Remove App Store Connect API key
        if: always()
        run: rm -rf ~/.appstoreconnect/private_keys
