name: mekuru
description: "Japanese EPUB Reader with vertical text and offline Yomitan dictionary."
publish_to: 'none'
version: 1.31.4+1

environment:
  sdk: ^3.10.8

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8
  intl: ^0.20.2

  # State Management (with Riverpod code generation)
  flutter_riverpod: ^3.1.0
  riverpod_annotation: ^4.0.0

  # Database (Drift — SQLite-backed, type-safe, isolate support)
  drift: ^2.33.0
  sqlite3_flutter_libs: ^0.6.0+eol
  drift_flutter: ^0.3.0

  # Reader rendering (custom epub.js bridge via InAppWebView)
  flutter_inappwebview: ^6.1.5

  # File Handling
  archive: ^4.0.7
  file_picker: ^12.0.0-beta.7
  path_provider: ^2.1.5
  path: ^1.9.1

  # Japanese morphological analysis
  mecab_for_flutter: ^2.0.0

  # Streaming JSON parsing (for large dictionary collection files)
  json_events: ^1.2.2

  # Fuzzy search
  fuzzy_bolt: ^2.0.2

  # Image processing (manga auto-crop)
  image: ^4.0.0

  # Utilities
  convert: ^3.1.2
  csv: ^8.0.0
  crypto: ^3.0.6
  uuid: ^4.5.3
  mime: ^2.0.0
  xml: ^6.5.0
  share_plus: ^13.1.0
  shared_preferences: ^2.5.3
  in_app_review: ^2.0.10
  flutter_secure_storage: ^10.0.0
  url_launcher: ^6.3.1
  package_info_plus: ^10.1.0
  # Android build properties, used to spot emulators and device farms
  device_info_plus: ^13.2.0

  # Error tracking and user feedback
  sentry_flutter: ^9.14.0

  # Confetti animation (Pro unlock celebration)
  confetti: ^0.8.0

  # Reader display
  screen_brightness: ^2.1.7
  wakelock_plus: ^1.4.0
  flutter_tilt: ^4.0.0

  # Kanji stroke order
  flutter_svg: ^2.0.17

  # Reading stats charts. The activity heatmap is hand-painted rather than
  # taken from heatmap_calendar_plus: that package fills every cell with a
  # solid color and offers no border, so it cannot render empty days as an
  # outline on the surface (see the reading-stats spec's Color section).
  fl_chart: ^1.2.0

  # AnkiDroid integration (Android only)
  ankidroid_for_flutter: ^1.0.3

  # Firebase (OCR server authentication + analytics)
  firebase_core: ^4.5.0
  firebase_auth: ^6.2.0
  firebase_app_check: ^0.4.1+4
  firebase_analytics: ^12.1.3
  google_sign_in: ^7.2.0

  # In-app purchases (OCR monetization)
  # in_app_purchase_android >=0.5.0 ships Play Billing Library 8.0.0, which Play
  # requires. Do not downgrade below 0.5.0.
  in_app_purchase: ^3.3.0
  in_app_purchase_android: ^0.5.2

  # Background task scheduling (OCR processing)
  workmanager: ^0.9.0

  # HTTP client for OCR server
  http: ^1.3.0
  http_parser: ^4.1.2
  flutter_reorderable_grid_view: ^5.7.0
dev_dependencies:
  sentry_dart_plugin: ^3.2.1
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  sqlite3: ^3.3.1

  # Code generation
  drift_dev: ^2.33.0
  riverpod_generator: ^4.0.0
  build_runner: ^2.4.0
  environment_config: ^4.0.0+1

flutter:
  default-flavor: play
  generate: true
  uses-material-design: true

  assets:
    - assets/epub_viewer/
    - assets/ipadic/
    - assets/user_dict/

sentry:
  upload_debug_symbols: true
  upload_source_maps: true
  project: mekuru
  org: matt-dl
  
