name: local_manga_ocr
description: Native, resumable Japanese manga OCR for Mekuru.
version: 0.1.0
publish_to: none
environment:
  sdk: ^3.10.8
  flutter: '>=3.38.0'
dependencies:
  flutter:
    sdk: flutter
flutter:
  plugin:
    platforms:
      android:
        package: moe.matthew.mekuru.ocr
        pluginClass: LocalMangaOcrPlugin
  assets:
    - assets/licenses/
