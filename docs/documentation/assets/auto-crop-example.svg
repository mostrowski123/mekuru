<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 420" width="560" height="420" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <!-- The panels of one manga page, in page pixels (760 x 1108). -->
    <g id="art" stroke="#000" stroke-width="8">
      <rect width="760" height="1108" fill="#fff" stroke="none"/>
      <rect x="4" y="4" width="752" height="332" fill="#fff"/>
      <circle cx="230" cy="200" r="80" fill="#cfcfcf" stroke="none"/>
      <rect x="140" y="270" width="180" height="62" fill="#cfcfcf" stroke="none"/>
      <ellipse cx="590" cy="160" rx="95" ry="125" fill="#fff"/>
      <path d="M560 85v150M595 85v150M630 85v120" stroke-width="12"/>

      <rect x="4" y="366" width="362" height="362" fill="#fff"/>
      <circle cx="185" cy="580" r="105" fill="#d9d9d9" stroke="none"/>
      <ellipse cx="290" cy="450" rx="55" ry="70" fill="#fff"/>
      <path d="M275 410v80M305 410v65" stroke-width="12"/>

      <rect x="394" y="366" width="362" height="362" fill="#fff"/>
      <ellipse cx="575" cy="520" rx="85" ry="115" fill="#fff"/>
      <path d="M545 445v150M580 445v150M615 445v110" stroke-width="12"/>
      <rect x="400" y="650" width="350" height="72" fill="#cfcfcf" stroke="none"/>

      <rect x="4" y="758" width="752" height="346" fill="#fff"/>
      <path d="M8 1100l200-180 160 120 150-150 230 210z" fill="#d9d9d9" stroke="none"/>
      <ellipse cx="150" cy="890" rx="90" ry="100" fill="#fff"/>
      <path d="M120 830v120M155 830v120M190 830v90" stroke-width="12"/>
    </g>
  </defs>

  <rect width="560" height="420" rx="16" fill="#f4f4f4"/>

  <!-- Auto-Crop off: the whole page, white margins and page number included. -->
  <rect x="60" y="20" width="180" height="340" rx="24" fill="#2a2a2a"/>
  <rect x="70" y="40" width="160" height="300" fill="#000"/>
  <rect x="70" y="76.4" width="160" height="227.2" fill="#fff"/>
  <use href="#art" transform="translate(89.2 99.12) scale(0.16)"/>
  <text x="150" y="295" font-size="7" fill="#555" text-anchor="middle">12</text>
  <rect x="87.2" y="97.1" width="125.6" height="181.3" fill="none" stroke="#e53935" stroke-width="1.5" stroke-dasharray="4 3"/>

  <!-- Auto-Crop on: only the part inside the dashed line, scaled up. -->
  <rect x="320" y="20" width="180" height="340" rx="24" fill="#2a2a2a"/>
  <rect x="330" y="40" width="160" height="300" fill="#000"/>
  <use href="#art" transform="translate(330 73.37) scale(0.2105)"/>

  <path d="M258 190h40m-8-6 8 6-8 6" fill="none" stroke="#555" stroke-width="2"/>

  <text x="150" y="392" font-size="15" fill="#222" text-anchor="middle">Auto-Crop off</text>
  <text x="410" y="392" font-size="15" fill="#222" text-anchor="middle">Auto-Crop on</text>
</svg>
